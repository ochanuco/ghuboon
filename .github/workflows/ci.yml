name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ochanuco/.github/.github/workflows/dotnet.yml@ddb8e656d5e975d255c122b0090df4efcb7a5cae # v1.8.0
    with:
      runs-on: macos-latest
      dotnet-version: 10.0.x
      test-results: "**/TestResults/*.trx"
      # Two test invocations so the Avalonia headless smoke runs in a
      # fresh test-host process. Booting the headless dispatcher claims
      # Dispatcher.UIThread; if a non-headless test in the same process
      # already touched Avalonia statics, SetupUnsafe fails on
      # VerifyAccess. Splitting by Category=Headless gives each set its
      # own process.
      run: |
        dotnet restore
        dotnet build --configuration Release --no-restore
        dotnet test --configuration Release --no-build --filter "Category!=Headless" --logger "trx;LogFileName=test-results.trx"
        dotnet test --configuration Release --no-build --filter "Category=Headless" --logger "trx;LogFileName=test-results-headless.trx"
