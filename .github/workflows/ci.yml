name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ochanuco/.github/.github/workflows/dotnet.yml@e5102a8ff65b3c15a2afa263d4970dbbe6538862 # v1.1.0
    with:
      runs-on: macos-latest
      dotnet-version: 10.0.x
      test-results: "**/TestResults/*.trx"
      run: |
        dotnet restore
        dotnet build --configuration Release --no-restore
        dotnet test --configuration Release --no-build --filter "Category!=Headless" --logger "trx;LogFileName=test-results.trx"
        dotnet test --configuration Release --no-build --filter "Category=Headless" --logger "trx;LogFileName=test-results-headless.trx"
